{% extends "base.html" %}

{% block title %}Farmer Login — Shram setuu{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Shram setuu Logo" style="height: 64px; width: 64px; object-fit: contain; border-radius: 8px; margin: 0 auto 1rem; display: block;">
      <h1 class="auth-title">Farmer Login</h1>
      <p style="color: var(--text-muted); font-size: 0.92rem;">
        Access your saved schemes, crop guides, and community discussions.
      </p>
    </div>

    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label for="loginInput" class="form-label">Username or Email Address</label>
        <div style="position: relative;">
          <input type="text" name="username_or_email" id="loginInput" class="form-control" placeholder="e.g. ramesh_kumar or email" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
          <label for="passwordInput" class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter your account password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Platform
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.92rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{{ url_for('register') }}" style="font-weight: 700; color: var(--primary-green);">Register as a Farmer</a>
    </div>
  </div>
</div>
{% endblock %}
